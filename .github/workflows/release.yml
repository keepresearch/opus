name: Publish rolling Release
on:
  push:
    tags: ['rolling-*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag identity and rolling ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "rolling-$(node -p 'require("./package.json").version')"
          git fetch origin rolling
          git merge-base --is-ancestor "$GITHUB_SHA" origin/rolling
  build:
    needs: identity
    uses: ./.github/workflows/native.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: build/assets
      - name: Verify and assemble complete Release
        run: node scripts/manifest.js build/assets
      - name: Publish attachments only after all platform tests pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            echo 'Release already exists; do not overwrite versioned attachments.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "$RELEASE_TAG" --notes 'libopus 1.6.1; N-API v3; x64 runtime SIMD dispatch and ARM64 NEON. Linux glibc >= 2.28 / musl >= 1.2.5, macOS >= 11.0. No npm publication. See README and manifest.json for installation and build identities.'
          gh release upload "$RELEASE_TAG" build/assets/*.node build/assets/manifest.json build/assets/LICENSES.txt
          gh release edit "$RELEASE_TAG" --draft=false
  consumer:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global pnpm@12.5.1
      - name: Install the public Git dependency with compilation disabled
        run: node scripts/check-consumer.js "$GITHUB_SHA"
